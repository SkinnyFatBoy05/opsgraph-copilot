name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python -m opsgraph.evaluation.runner --provider fake --output ../evaluation/reports/ci
      - run: python ../scripts/verify_artifacts.py --report ../evaluation/reports/ci/latest.json
      - uses: actions/upload-artifact@v7
        with:
          name: deterministic-evaluation
          path: evaluation/reports/ci/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm audit --audit-level=high
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --locked
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opsgraph
          POSTGRES_USER: opsgraph
          POSTGRES_PASSWORD: local-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsgraph -d opsgraph"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --locked
        working-directory: backend
      - run: uv run pytest tests/integration/test_pgvector_retrieval.py -q
        working-directory: backend
        env:
          OPSGRAPH_TEST_POSTGRES_URL: postgresql://opsgraph:local-synthetic-only@127.0.0.1:5432/opsgraph

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build api web
      - run: docker compose up -d --wait api web
      - run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/health/ready
      - run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/api/v1/evaluations/latest
      - run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/
      - if: always()
        run: docker compose down
      - run: docker compose -f compose.demo.yml config --quiet
      - run: docker compose -f compose.demo.yml up --build -d --wait
      - run: python scripts/smoke_demo.py
      - run: test "$(docker compose -f compose.demo.yml exec -T api id -u)" = "10001"
      - if: always()
        run: docker compose -f compose.demo.yml down
