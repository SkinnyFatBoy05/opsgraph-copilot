name: opsgraph-copilot

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPSGRAPH_PROFILE: local
      OPSGRAPH_MODEL_PROVIDER: fake
      OPSGRAPH_TELEMETRY_ENABLED: "${OPSGRAPH_TELEMETRY_ENABLED:-false}"
      OPSGRAPH_TELEMETRY_EXPORTER: "${OPSGRAPH_TELEMETRY_EXPORTER:-otlp}"
      OPSGRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: "${OPSGRAPH_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opsgraph
      POSTGRES_USER: opsgraph
      POSTGRES_PASSWORD: local-synthetic-only
    ports:
      - "${OPSGRAPH_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsgraph -d opsgraph"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - opsgraph-postgres:/var/lib/postgresql/data
    profiles: ["data"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    profiles: ["observability"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      - jaeger
    profiles: ["observability"]

volumes:
  opsgraph-postgres:
