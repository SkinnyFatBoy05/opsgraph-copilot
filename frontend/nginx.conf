limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_conn connections_per_ip 20;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        limit_req zone=api_per_ip burst=15 nodelay;
        limit_req_status 429;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8000/health/;
    }

    location / {
        try_files $uri /index.html;
    }
}
