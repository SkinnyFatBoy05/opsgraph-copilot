# Standalone synthetic demo behind a TLS reverse proxy.
# docker compose -f compose.demo.yml up --build -d --wait
name: opsgraph-demo
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPSGRAPH_PROFILE: aws-demo
      OPSGRAPH_MODEL_PROVIDER: fake
      OPSGRAPH_TELEMETRY_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
