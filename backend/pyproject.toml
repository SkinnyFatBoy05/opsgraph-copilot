[project]
name = "opsgraph-backend"
version = "0.1.0"
description = "Evidence-first agent platform for synthetic financial operations workflows"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Kishore Srinivasan" }]
dependencies = [
    "faiss-cpu>=1.12",
    "fastapi[standard]>=0.141.1",
    "langgraph>=1.0",
    "numpy>=2.0",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
    "opentelemetry-sdk>=1.30,<2",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.0",
    "pyyaml>=6.0",
    "sqlglot>=27.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsgraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: tests that require an external service",
]
